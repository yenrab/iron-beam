[package]
name = "infrastructure_compile_server"
version = "0.1.0"
edition = "2021"
description = "Distributed compilation server coordination for Erlang BEAM compiler infrastructure"
license = "Apache-2.0"
authors = ["Erlang/OTP Team"]
repository = "https://github.com/erlang/otp"
keywords = ["erlang", "beam", "distributed", "compilation", "server"]
categories = ["network-programming", "concurrency"]

[dependencies]
infrastructure_memory_management = { path = "../infrastructure_memory_management" }
infrastructure_error_handling = { path = "../infrastructure_error_handling" }
infrastructure_platform_support = { path = "../infrastructure_platform_support" }
infrastructure_environment_config = { path = "../infrastructure_environment_config" }
infrastructure_process_execution = { path = "../infrastructure_process_execution" }

# Safe networking and serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1.0", features = ["rt", "net", "io-util", "sync", "macros"] }
thiserror = "1.0"
once_cell = "1.20"

[lib]
name = "infrastructure_compile_server"
path = "src/lib.rs"
