[package]
name = "infrastructure_platform_support"
version = "0.1.0"
edition = "2021"
description = "Platform-specific utilities for Erlang BEAM compiler infrastructure"
license = "Apache-2.0"
authors = ["Erlang/OTP Team"]
repository = "https://github.com/erlang/otp"
keywords = ["erlang", "beam", "platform", "encoding", "command-line"]
categories = ["os", "encoding", "command-line-interface"]

[dependencies]
infrastructure_memory_management = { path = "../infrastructure_memory_management" }
encoding_rs = "0.8"
cfg-if = "1.0"
thiserror = "1.0"

[target.'cfg(windows)'.dependencies]
winapi = { version = "0.3", features = ["processenv", "winbase"] }

[lib]
name = "infrastructure_platform_support"
path = "src/lib.rs"
