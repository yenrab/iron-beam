[package]
name = "infrastructure_environment_config"
version = "0.1.0"
edition = "2021"
description = "Environment variable management for Erlang BEAM compiler infrastructure"
license = "Apache-2.0"
authors = ["Erlang/OTP Team"]
repository = "https://github.com/erlang/otp"
keywords = ["erlang", "beam", "environment", "configuration"]
categories = ["os", "config"]

[dependencies]
infrastructure_memory_management = { path = "../infrastructure_memory_management" }
infrastructure_error_handling = { path = "../infrastructure_error_handling" }
infrastructure_platform_support = { path = "../infrastructure_platform_support" }

[lib]
name = "infrastructure_environment_config"
path = "src/lib.rs"
